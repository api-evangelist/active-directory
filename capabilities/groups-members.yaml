naftiko: 1.0.0-alpha2
info:
  label: Microsoft Graph Groups API — Members
  description: 'Microsoft Graph Groups API — Members. 3 operations. Lead operation: Active Directory List Group Members. Self-contained
    Naftiko capability covering one Active Directory business surface.'
  tags:
  - Active Directory
  - Members
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ACTIVE_DIRECTORY_API_KEY: ACTIVE_DIRECTORY_API_KEY
capability:
  consumes:
  - type: http
    namespace: groups-members
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Groups API — Members business capability. Self-contained, no shared references.
    resources:
    - name: groups-groupId-members
      path: /groups/{groupId}/members
      operations:
      - name: listgroupmembers
        method: GET
        description: Active Directory List Group Members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: groupId
          in: path
          type: string
          description: Group object ID (UUID)
          required: true
        - name: $filter
          in: query
          type: string
          description: Filter to scope to specific member types (e.g. microsoft.graph.user)
        - name: $top
          in: query
          type: integer
        - name: $select
          in: query
          type: string
      - name: addgroupmember
        method: POST
        description: Active Directory Add Group Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: groupId
          in: path
          type: string
          description: Group object ID (UUID)
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: groups-groupId-members-memberId-$ref
      path: /groups/{groupId}/members/{memberId}/$ref
      operations:
      - name: removegroupmember
        method: DELETE
        description: Active Directory Remove Group Member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: groupId
          in: path
          type: string
          description: Group object ID (UUID)
          required: true
        - name: memberId
          in: path
          type: string
          description: Member object ID to remove
          required: true
    authentication:
      type: bearer
      token: '{{env.ACTIVE_DIRECTORY_API_KEY}}'
  exposes:
  - type: rest
    namespace: groups-members-rest
    port: 8080
    description: REST adapter for Microsoft Graph Groups API — Members. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/groups/{groupid}/members
      name: groups-groupid-members
      description: REST surface for groups-groupId-members.
      operations:
      - method: GET
        name: listgroupmembers
        description: Active Directory List Group Members
        call: groups-members.listgroupmembers
        with:
          groupId: rest.groupId
          $filter: rest.$filter
          $top: rest.$top
          $select: rest.$select
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: addgroupmember
        description: Active Directory Add Group Member
        call: groups-members.addgroupmember
        with:
          groupId: rest.groupId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/groups/{groupid}/members/{memberid}/ref
      name: groups-groupid-members-memberid-ref
      description: REST surface for groups-groupId-members-memberId-$ref.
      operations:
      - method: DELETE
        name: removegroupmember
        description: Active Directory Remove Group Member
        call: groups-members.removegroupmember
        with:
          groupId: rest.groupId
          memberId: rest.memberId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: groups-members-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Graph Groups API — Members. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: active-directory-list-group-members
      description: Active Directory List Group Members
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: groups-members.listgroupmembers
      with:
        groupId: tools.groupId
        $filter: tools.$filter
        $top: tools.$top
        $select: tools.$select
      outputParameters:
      - type: object
        mapping: $.
    - name: active-directory-add-group-member
      description: Active Directory Add Group Member
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: groups-members.addgroupmember
      with:
        groupId: tools.groupId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: active-directory-remove-group-member
      description: Active Directory Remove Group Member
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: groups-members.removegroupmember
      with:
        groupId: tools.groupId
        memberId: tools.memberId
      outputParameters:
      - type: object
        mapping: $.
