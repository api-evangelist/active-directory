naftiko: "1.0.0-alpha1"

info:
  label: Microsoft Graph Users API
  description: Microsoft Graph Users API for managing Microsoft Entra ID user accounts, profiles, licenses, and memberships.
  tags:
    - Active Directory
    - Identity Management
    - Microsoft Entra
    - Users
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AD_ACCESS_TOKEN: AD_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: active-directory-users
      baseUri: https://graph.microsoft.com/v1.0
      description: Microsoft Graph Users API v1.0
      authentication:
        type: bearer
        token: "{{AD_ACCESS_TOKEN}}"
      resources:
        - name: users
          path: /users
          description: Microsoft Entra ID user accounts
          operations:
            - name: list-users
              method: GET
              description: List all users in the Microsoft Entra tenant with optional OData filtering
              inputParameters:
                - name: $filter
                  in: query
                  type: string
                  required: false
                  description: OData filter expression
                - name: $select
                  in: query
                  type: string
                  required: false
                  description: Properties to include in response
                - name: $top
                  in: query
                  type: integer
                  required: false
                  description: Maximum number of results
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-user
              method: POST
              description: Create a new user in Microsoft Entra ID
              inputParameters:
                - name: displayName
                  in: body
                  type: string
                  required: true
                  description: Display name for the user
                - name: userPrincipalName
                  in: body
                  type: string
                  required: true
                  description: UPN in alias@domain format
                - name: mailNickname
                  in: body
                  type: string
                  required: true
                  description: Mail alias for the user
                - name: accountEnabled
                  in: body
                  type: boolean
                  required: true
                  description: Whether the account is active
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: user
          path: /users/{userId}
          description: Individual user operations
          operations:
            - name: get-user
              method: GET
              description: Get a specific user by object ID or UPN
              inputParameters:
                - name: userId
                  in: path
                  type: string
                  required: true
                  description: User object ID or userPrincipalName
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: update-user
              method: PATCH
              description: Update user properties
              inputParameters:
                - name: userId
                  in: path
                  type: string
                  required: true
                  description: User object ID or userPrincipalName
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-user
              method: DELETE
              description: Delete a user (soft-delete with 30-day recycle bin)
              inputParameters:
                - name: userId
                  in: path
                  type: string
                  required: true
                  description: User object ID or userPrincipalName
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: me
          path: /me
          description: Signed-in user profile
          operations:
            - name: get-me
              method: GET
              description: Get the signed-in user's profile (delegated auth only)
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: active-directory-users-api
      resources:
        - path: /v1/users
          name: users
          description: User management
          operations:
            - method: GET
              name: list-users
              description: List users
              call: "active-directory-users.list-users"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-user
              description: Create user
              call: "active-directory-users.create-user"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: active-directory-users-mcp
      transport: http
      tools:
        - name: list-users
          description: List Microsoft Entra ID users with optional OData filtering and property selection
          hints:
            readOnly: true
            openWorld: true
          call: "active-directory-users.list-users"
          with:
            $filter: "tools.$filter"
            $select: "tools.$select"
            $top: "tools.$top"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-user
          description: Get a specific Microsoft Entra user by object ID or userPrincipalName
          hints:
            readOnly: true
            idempotent: true
          call: "active-directory-users.get-user"
          with:
            userId: "tools.userId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-user
          description: Create a new user account in Microsoft Entra ID
          hints:
            readOnly: false
            idempotent: false
          call: "active-directory-users.create-user"
          with:
            displayName: "tools.displayName"
            userPrincipalName: "tools.userPrincipalName"
            mailNickname: "tools.mailNickname"
            accountEnabled: "tools.accountEnabled"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-me
          description: Get the signed-in user's Microsoft Entra profile (requires delegated auth)
          hints:
            readOnly: true
            idempotent: true
          call: "active-directory-users.get-me"
          outputParameters:
            - type: object
              mapping: "$."
