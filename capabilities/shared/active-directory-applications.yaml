naftiko: "1.0.0-alpha1"

info:
  label: Microsoft Graph Applications and Service Principals API
  description: Microsoft Graph API for managing application registrations and service principals in Microsoft Entra ID.
  tags:
    - Active Directory
    - Applications
    - Identity Management
    - Microsoft Entra
    - OAuth2
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AD_ACCESS_TOKEN: AD_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: active-directory-applications
      baseUri: https://graph.microsoft.com/v1.0
      description: Microsoft Graph Applications API v1.0
      authentication:
        type: bearer
        token: "{{AD_ACCESS_TOKEN}}"
      resources:
        - name: applications
          path: /applications
          description: Application registration management
          operations:
            - name: list-applications
              method: GET
              description: List all registered applications in the tenant
              inputParameters:
                - name: $filter
                  in: query
                  type: string
                  required: false
                - name: $select
                  in: query
                  type: string
                  required: false
                - name: $top
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-application
              method: GET
              description: Get an application registration by object ID
              inputParameters:
                - name: applicationId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: service-principals
          path: /servicePrincipals
          description: Service principal management
          operations:
            - name: list-service-principals
              method: GET
              description: List all service principals in the tenant
              inputParameters:
                - name: $filter
                  in: query
                  type: string
                  required: false
                - name: $top
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-service-principal
              method: GET
              description: Get a service principal by object ID
              inputParameters:
                - name: servicePrincipalId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8102
      namespace: active-directory-applications-api
      resources:
        - path: /v1/applications
          name: applications
          description: Application listing
          operations:
            - method: GET
              name: list-applications
              description: List applications
              call: "active-directory-applications.list-applications"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9102
      namespace: active-directory-applications-mcp
      transport: http
      tools:
        - name: list-applications
          description: List Microsoft Entra application registrations
          hints:
            readOnly: true
            openWorld: true
          call: "active-directory-applications.list-applications"
          with:
            $filter: "tools.$filter"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-application
          description: Get a specific Microsoft Entra application registration
          hints:
            readOnly: true
            idempotent: true
          call: "active-directory-applications.get-application"
          with:
            applicationId: "tools.applicationId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-service-principals
          description: List service principals in Microsoft Entra tenant
          hints:
            readOnly: true
            openWorld: true
          call: "active-directory-applications.list-service-principals"
          with:
            $filter: "tools.$filter"
          outputParameters:
            - type: object
              mapping: "$."
