naftiko: 1.0.0-alpha2
info:
  label: Microsoft Active Directory Identity Management Operations
  description: Unified workflow for managing Microsoft Entra ID (Active Directory) identity and access operations including
    user lifecycle management, group management, and application registration. Used by IT administrators, identity engineers,
    and security teams to automate identity governance and access management.
  tags:
  - Active Directory
  - Identity Management
  - Microsoft Entra
  - User Management
  - Zero Trust
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AD_ACCESS_TOKEN: AD_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: active-directory-users
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Users API v1.0
    authentication:
      type: bearer
      token: '{{AD_ACCESS_TOKEN}}'
    resources:
    - name: users
      path: /users
      description: Microsoft Entra ID user accounts
      operations:
      - name: list-users
        method: GET
        description: List all users in the Microsoft Entra tenant with optional OData filtering
        inputParameters:
        - name: $filter
          in: query
          type: string
          required: false
          description: OData filter expression
        - name: $select
          in: query
          type: string
          required: false
          description: Properties to include in response
        - name: $top
          in: query
          type: integer
          required: false
          description: Maximum number of results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-user
        method: POST
        description: Create a new user in Microsoft Entra ID
        inputParameters:
        - name: displayName
          in: body
          type: string
          required: true
          description: Display name for the user
        - name: userPrincipalName
          in: body
          type: string
          required: true
          description: UPN in alias@domain format
        - name: mailNickname
          in: body
          type: string
          required: true
          description: Mail alias for the user
        - name: accountEnabled
          in: body
          type: boolean
          required: true
          description: Whether the account is active
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: user
      path: /users/{userId}
      description: Individual user operations
      operations:
      - name: get-user
        method: GET
        description: Get a specific user by object ID or UPN
        inputParameters:
        - name: userId
          in: path
          type: string
          required: true
          description: User object ID or userPrincipalName
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-user
        method: PATCH
        description: Update user properties
        inputParameters:
        - name: userId
          in: path
          type: string
          required: true
          description: User object ID or userPrincipalName
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-user
        method: DELETE
        description: Delete a user (soft-delete with 30-day recycle bin)
        inputParameters:
        - name: userId
          in: path
          type: string
          required: true
          description: User object ID or userPrincipalName
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: me
      path: /me
      description: Signed-in user profile
      operations:
      - name: get-me
        method: GET
        description: Get the signed-in user's profile (delegated auth only)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: active-directory-groups
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Groups API v1.0
    authentication:
      type: bearer
      token: '{{AD_ACCESS_TOKEN}}'
    resources:
    - name: groups
      path: /groups
      description: Microsoft Entra group registry
      operations:
      - name: list-groups
        method: GET
        description: List all groups with optional OData filtering
        inputParameters:
        - name: $filter
          in: query
          type: string
          required: false
          description: OData filter (e.g. groupTypes/any(c:c eq 'Unified'))
        - name: $select
          in: query
          type: string
          required: false
          description: Properties to include
        - name: $top
          in: query
          type: integer
          required: false
          description: Maximum results
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-group
        method: POST
        description: Create a new security group or Microsoft 365 group
        inputParameters:
        - name: displayName
          in: body
          type: string
          required: true
        - name: mailEnabled
          in: body
          type: boolean
          required: true
        - name: mailNickname
          in: body
          type: string
          required: true
        - name: securityEnabled
          in: body
          type: boolean
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: group
      path: /groups/{groupId}
      description: Individual group operations
      operations:
      - name: get-group
        method: GET
        description: Get a specific group by object ID
        inputParameters:
        - name: groupId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: group-members
      path: /groups/{groupId}/members
      description: Group member management
      operations:
      - name: list-group-members
        method: GET
        description: List direct members of a group
        inputParameters:
        - name: groupId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: active-directory-applications
    baseUri: https://graph.microsoft.com/v1.0
    description: Microsoft Graph Applications API v1.0
    authentication:
      type: bearer
      token: '{{AD_ACCESS_TOKEN}}'
    resources:
    - name: applications
      path: /applications
      description: Application registration management
      operations:
      - name: list-applications
        method: GET
        description: List all registered applications in the tenant
        inputParameters:
        - name: $filter
          in: query
          type: string
          required: false
        - name: $select
          in: query
          type: string
          required: false
        - name: $top
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-application
        method: GET
        description: Get an application registration by object ID
        inputParameters:
        - name: applicationId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: service-principals
      path: /servicePrincipals
      description: Service principal management
      operations:
      - name: list-service-principals
        method: GET
        description: List all service principals in the tenant
        inputParameters:
        - name: $filter
          in: query
          type: string
          required: false
        - name: $top
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-service-principal
        method: GET
        description: Get a service principal by object ID
        inputParameters:
        - name: servicePrincipalId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: active-directory-identity-api
    description: Unified REST API for Microsoft Active Directory identity management operations.
    resources:
    - path: /v1/users
      name: users
      description: User lifecycle management
      operations:
      - method: GET
        name: list-users
        description: List users
        call: active-directory-users.list-users
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-user
        description: Create user
        call: active-directory-users.create-user
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{userId}
      name: user
      description: Individual user operations
      operations:
      - method: GET
        name: get-user
        description: Get user by ID or UPN
        call: active-directory-users.get-user
        with:
          userId: rest.userId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/me
      name: me
      description: Signed-in user profile
      operations:
      - method: GET
        name: get-me
        description: Get signed-in user profile
        call: active-directory-users.get-me
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/groups
      name: groups
      description: Group management
      operations:
      - method: GET
        name: list-groups
        description: List groups
        call: active-directory-groups.list-groups
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-group
        description: Create group
        call: active-directory-groups.create-group
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/groups/{groupId}
      name: group
      description: Individual group operations
      operations:
      - method: GET
        name: get-group
        description: Get group
        call: active-directory-groups.get-group
        with:
          groupId: rest.groupId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/groups/{groupId}/members
      name: group-members
      description: Group member management
      operations:
      - method: GET
        name: list-group-members
        description: List group members
        call: active-directory-groups.list-group-members
        with:
          groupId: rest.groupId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/applications
      name: applications
      description: Application registrations
      operations:
      - method: GET
        name: list-applications
        description: List applications
        call: active-directory-applications.list-applications
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/servicePrincipals
      name: service-principals
      description: Service principals
      operations:
      - method: GET
        name: list-service-principals
        description: List service principals
        call: active-directory-applications.list-service-principals
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: active-directory-identity-mcp
    transport: http
    description: MCP server for AI-assisted Microsoft Active Directory identity management.
    tools:
    - name: list-users
      description: List Microsoft Entra ID users with optional filtering by department, job title, or other attributes
      hints:
        readOnly: true
        openWorld: true
      call: active-directory-users.list-users
      with:
        $filter: tools.$filter
        $select: tools.$select
        $top: tools.$top
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user
      description: Get details about a specific Microsoft Entra user by object ID or userPrincipalName
      hints:
        readOnly: true
        idempotent: true
      call: active-directory-users.get-user
      with:
        userId: tools.userId
      outputParameters:
      - type: object
        mapping: $.
    - name: create-user
      description: Create a new user account in Microsoft Entra ID with required profile and password settings
      hints:
        readOnly: false
        idempotent: false
      call: active-directory-users.create-user
      with:
        displayName: tools.displayName
        userPrincipalName: tools.userPrincipalName
        mailNickname: tools.mailNickname
        accountEnabled: tools.accountEnabled
      outputParameters:
      - type: object
        mapping: $.
    - name: get-me
      description: Get the signed-in user's Microsoft Entra profile
      hints:
        readOnly: true
        idempotent: true
      call: active-directory-users.get-me
      outputParameters:
      - type: object
        mapping: $.
    - name: list-groups
      description: List Microsoft Entra ID groups — security groups and Microsoft 365 groups
      hints:
        readOnly: true
        openWorld: true
      call: active-directory-groups.list-groups
      with:
        $filter: tools.$filter
        $select: tools.$select
      outputParameters:
      - type: object
        mapping: $.
    - name: get-group
      description: Get details about a specific Microsoft Entra group including type and membership settings
      hints:
        readOnly: true
        idempotent: true
      call: active-directory-groups.get-group
      with:
        groupId: tools.groupId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-group-members
      description: List direct members of a Microsoft Entra group
      hints:
        readOnly: true
        openWorld: true
      call: active-directory-groups.list-group-members
      with:
        groupId: tools.groupId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-applications
      description: List application registrations in the Microsoft Entra tenant
      hints:
        readOnly: true
        openWorld: true
      call: active-directory-applications.list-applications
      with:
        $filter: tools.$filter
      outputParameters:
      - type: object
        mapping: $.
    - name: get-application
      description: Get details about a specific Microsoft Entra application registration
      hints:
        readOnly: true
        idempotent: true
      call: active-directory-applications.get-application
      with:
        applicationId: tools.applicationId
      outputParameters:
      - type: object
        mapping: $.
    - name: list-service-principals
      description: List service principals in the Microsoft Entra tenant
      hints:
        readOnly: true
        openWorld: true
      call: active-directory-applications.list-service-principals
      with:
        $filter: tools.$filter
      outputParameters:
      - type: object
        mapping: $.
