      path: /groups/{groupId}
      operations:
      - name: getgroup
        method: GET
        description: Active Directory Get Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: groupId
          in: path
          type: string
          description: Group object ID (UUID)
          required: true
        - name: $select
          in: query
          type: string
          description: Comma-separated properties to include
      - name: updategroup
        method: PATCH
        description: Active Directory Update Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: groupId
          in: path
          type: string
          description: Group object ID (UUID)
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletegroup
