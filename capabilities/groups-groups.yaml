      operations:
      - name: listgroups
        method: GET
        description: Active Directory List Groups
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: $filter
          in: query
          type: string
          description: OData filter (e.g. groupTypes/any(c:c eq 'Unified') for M365 groups)
        - name: $select
          in: query
          type: string
          description: Comma-separated list of properties to include
        - name: $top
          in: query
          type: integer
          description: Maximum number of groups to return (max 999)
        - name: $orderby
          in: query
          type: string
          description: Property to sort by (e.g. displayName asc)
        - name: $search
          in: query
          type: string
          description: Search for groups by displayName or description
        - name: $count
          in: query
          type: boolean
          description: Include total count of matching groups
      - name: creategroup
        method: POST
        description: Active Directory Create Group
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
