specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Microsoft Active Directory
providerId: active-directory
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Active Directory
  - Authentication
  - Authorization
  - Directory Services
  - Identity Management
  - Microsoft Entra
  - Zero Trust
  - Rate Limiting
  - Quotas
  - Throttling
description: Machine-readable rate limit definitions for the Microsoft Active Directory API surface. Captures
  per-tier quotas, burst behavior, response signaling, and recovery semantics. Defaults are scaffold values
  to be replaced with published provider limits.
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
  retryAfter: Retry-After
  policy: RateLimit-Policy
responseCodes:
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
  - tier: free
    name: Free Tier Default
    scope: api-key
    metric: requests_per_minute
    limit: 10
    burst: 20
    timeFrame: minute
    applies:
      - Microsoft Graph Users API
      - Microsoft Graph Groups API
      - Microsoft Graph Applications and Service Principals API
      - Microsoft Graph Devices API
      - Microsoft Graph Directory Roles and Administrative Units API
      - Microsoft Graph Conditional Access API
      - Microsoft Graph Identity Governance API
      - Microsoft Graph Identity Protection API
      - Microsoft Graph Authentication Methods API
      - Microsoft Graph Identity and Access Reports API
  - tier: free
    name: Free Tier Monthly Quota
    scope: api-key
    metric: requests_per_month
    limit: 1000
    timeFrame: month
    applies:
      - Microsoft Graph Users API
      - Microsoft Graph Groups API
      - Microsoft Graph Applications and Service Principals API
      - Microsoft Graph Devices API
      - Microsoft Graph Directory Roles and Administrative Units API
      - Microsoft Graph Conditional Access API
      - Microsoft Graph Identity Governance API
      - Microsoft Graph Identity Protection API
      - Microsoft Graph Authentication Methods API
      - Microsoft Graph Identity and Access Reports API
  - tier: professional
    name: Professional Tier Default
    scope: api-key
    metric: requests_per_minute
    limit: 100
    burst: 200
    timeFrame: minute
    applies:
      - Microsoft Graph Users API
      - Microsoft Graph Groups API
      - Microsoft Graph Applications and Service Principals API
      - Microsoft Graph Devices API
      - Microsoft Graph Directory Roles and Administrative Units API
      - Microsoft Graph Conditional Access API
      - Microsoft Graph Identity Governance API
      - Microsoft Graph Identity Protection API
      - Microsoft Graph Authentication Methods API
      - Microsoft Graph Identity and Access Reports API
  - tier: professional
    name: Professional Tier Monthly Quota
    scope: api-key
    metric: requests_per_month
    limit: 100000
    timeFrame: month
    applies:
      - Microsoft Graph Users API
      - Microsoft Graph Groups API
      - Microsoft Graph Applications and Service Principals API
      - Microsoft Graph Devices API
      - Microsoft Graph Directory Roles and Administrative Units API
      - Microsoft Graph Conditional Access API
      - Microsoft Graph Identity Governance API
      - Microsoft Graph Identity Protection API
      - Microsoft Graph Authentication Methods API
      - Microsoft Graph Identity and Access Reports API
  - tier: enterprise
    name: Enterprise Negotiated Limit
    scope: contract
    metric: requests_per_minute
    limit: 1000
    burst: 5000
    timeFrame: minute
    applies:
      - Microsoft Graph Users API
      - Microsoft Graph Groups API
      - Microsoft Graph Applications and Service Principals API
      - Microsoft Graph Devices API
      - Microsoft Graph Directory Roles and Administrative Units API
      - Microsoft Graph Conditional Access API
      - Microsoft Graph Identity Governance API
      - Microsoft Graph Identity Protection API
      - Microsoft Graph Authentication Methods API
      - Microsoft Graph Identity and Access Reports API
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter, honoring the Retry-After header
      when present.
  - name: Burst Handling
    description: Short bursts above the steady-state limit are tolerated up to the documented burst ceiling
      before throttling engages.
  - name: Quota Reset
    description: Monthly quotas reset at the start of each calendar month in UTC. Per-minute and per-second
      windows reset on a sliding-window basis.
  - name: Fair Use
    description: Even on uncapped enterprise tiers, sustained usage that materially impacts shared infrastructure
      may be subject to fair-use throttling.
maintainers:
  - name: Kin Lane
    email: kin@apievangelist.com
