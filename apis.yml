name: Microsoft Active Directory
url: https://developer.microsoft.com/en-us/graph
x-parent: microsoft-entra
description: Microsoft Active Directory and Microsoft Entra ID provide identity and access management
  for organizations of all sizes. Microsoft Graph API is the unified REST API gateway for accessing and
  managing Microsoft Entra ID (formerly Azure Active Directory), including users, groups, applications,
  devices, conditional access policies, identity governance, and directory administration. Legacy on-premises
  Active Directory is managed through LDAP, Kerberos, and PowerShell protocols; cloud identity is managed
  through Microsoft Graph.
