apis:
- name: Microsoft Graph Devices API
  description: Manage devices registered or joined to Microsoft Entra ID, including Entra joined, Entra
    registered, and hybrid Azure AD joined devices. Retrieve BitLocker recovery keys and Local Admin Password
    Solution (LAPS) credentials for managed devices.
  humanURL: https://learn.microsoft.com/en-us/graph/api/resources/device
  baseURL: https://graph.microsoft.com/v1.0
  tags:
  - Devices
  - Endpoint Management
  - Identity Management
  properties:
  - type: Documentation
    url: https://learn.microsoft.com/en-us/graph/api/resources/device
- name: Microsoft Graph Directory Roles and Administrative Units API
  description: Manage Microsoft Entra built-in and custom directory roles, role assignments, and role-scoped
    administrative units. Assign administrator roles to users, groups, or service principals, and create
    scoped role assignments via administrative units.
  humanURL: https://learn.microsoft.com/en-us/graph/api/resources/directoryrole
  baseURL: https://graph.microsoft.com/v1.0
  tags:
  - Authorization
  - Directory Services
  - Role Management
  properties:
  - type: Documentation
    url: https://learn.microsoft.com/en-us/graph/api/resources/directoryrole
- name: Microsoft Graph Conditional Access API
  description: Create and manage Microsoft Entra Conditional Access policies that enforce access controls
    based on user, location, device, and risk signals. Configure named locations, authentication context
    class references, and evaluate policy impact using what-if analysis.
  humanURL: https://learn.microsoft.com/en-us/graph/api/resources/conditionalaccesspolicy
  baseURL: https://graph.microsoft.com/v1.0
  tags:
  - Authorization
  - Conditional Access
  - Security
  - Zero Trust
  properties:
  - type: Documentation
    url: https://learn.microsoft.com/en-us/graph/api/resources/conditionalaccesspolicy
- name: Microsoft Graph Identity Governance API
  description: Manage Microsoft Entra ID Governance features including access reviews, entitlement management
    (access packages, catalogs, and policies), Privileged Identity Management (PIM) for just-in-time role
    activation, and lifecycle workflows for joiner/mover/leaver employee identity lifecycle automation.
  humanURL: https://learn.microsoft.com/en-us/graph/api/resources/identitygovernance-overview
  baseURL: https://graph.microsoft.com/v1.0
  tags:
  - Governance
  - Identity Management
  - Lifecycle Management
  - Privileged Identity Management
  properties:
  - type: Documentation
    url: https://learn.microsoft.com/en-us/graph/api/resources/identitygovernance-overview
- name: Microsoft Graph Identity Protection API
  description: Detect, investigate, and remediate identity-based risks using Microsoft Entra ID Protection.
    Access risk detections, risky users, risky service principals, and risk events, and feed data into
    SIEM tools for security correlation and incident response.
  humanURL: https://learn.microsoft.com/en-us/graph/api/resources/identityprotection-overview
  baseURL: https://graph.microsoft.com/v1.0
  tags:
  - Identity Protection
  - Risk Management
  - Security
  properties:
  - type: Documentation
    url: https://learn.microsoft.com/en-us/graph/api/resources/identityprotection-overview
- name: Microsoft Graph Authentication Methods API
  description: Manage authentication methods registered for users in Microsoft Entra ID, including FIDO2
    security keys, Microsoft Authenticator, phone (SMS/voice call), email OTP, Windows Hello for Business,
    and temporary access passes. Configure authentication method policies and authentication strength
    requirements.
  humanURL: https://learn.microsoft.com/en-us/graph/api/resources/authenticationmethods-overview
  baseURL: https://graph.microsoft.com/v1.0
  tags:
  - Authentication
  - MFA
  - Passwordless
  - Security
  properties:
  - type: Documentation
    url: https://learn.microsoft.com/en-us/graph/api/resources/authenticationmethods-overview
- name: Microsoft Graph Identity and Access Reports API
  description: Access audit logs, sign-in logs, provisioning logs, and identity-related reports for monitoring,
    compliance, and troubleshooting. Stream logs to Azure Monitor and Log Analytics or to third-party
    SIEM tools for security operations.
  humanURL: https://learn.microsoft.com/en-us/graph/api/resources/report-identity-access
  baseURL: https://graph.microsoft.com/v1.0
  tags:
  - Audit Logs
  - Compliance
