      - tenant
      - operation
principles:
  - name: Visibility
    description: Use Microsoft Cost Management on the EA / MCA enrollment for Entra licensing line items;
      use the Entra admin center "Licenses" pane for assignment counts; use the Microsoft Graph activity
      logs and the x-ms-throttle-limit-percentage header for automation pressure.
  - name: Allocation
    description: Allocate Entra seats by AD group → cost center mapping. For Workload ID, tag each managed
      identity with its owning application and route cost to the consuming product team.
  - name: Optimization
    description: Right-tier users (don't put everyone on P2 if only privileged users need PIM); reclaim
      seats from terminated employees through Lifecycle Workflows; consolidate point identity tools that
      are duplicated by Entra ID Governance, Internet Access, or Private Access; prefer change-notifications
      over polling to stay below throttle ceilings.
  - name: Accountability
    description: The IAM team owns tier mix and renewals; product owners own their Workload ID footprints
      and the Graph applications calling on their behalf.
