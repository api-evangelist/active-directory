description: FOCUS-aligned FinOps for Microsoft Entra ID (the modern Active Directory). Billed per user
  per month at a tier (Free / P1 / P2 / Suite) with optional standalone identity products (ID Governance,
  Internet Access, Private Access, Verified ID) and per-workload-identity charges for Workload ID. Programmatic
  access via Microsoft Graph is rate-limited rather than separately metered.
